<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog de Mitologia Nórdica</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Blog de Mitologia Nórdica</h1>
        <p>Vou compartilhar meus conhecimentos sobre a mitologia nórdica.</p>
    </header>

    <main>
        <article class="post">
            <img src="imagem-do-post.jpg" alt="Ilustração em preto e branco sobre mitos nórdicos">
            
            <div class="post-conteudo">
                <h2>Meu segundo post</h2>
                <p class="artigo-autor">Por: Willian dos Santos</p>
                <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar histórias antigas e culturas sobre a mitologia.</p>
                
                <div class="post-acoes">
                    <button type="button" aria-label="Curtir com coração">❤️ <span>0</span></button>
                    <button type="button" aria-label="Curtir com joinha">👍 <span>0</span></button>
                </div>
            </div>
        </article>
    </main>

    <script src="script.js"></script>
</body>
</html>
